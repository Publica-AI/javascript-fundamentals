<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Publica Academy — Enrolment Form Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
    input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .btn { padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: navy; color: white; border: none; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    #preview { color: #666; font-style: italic; min-height: 1.2em; }
    #status { font-weight: bold; color: green; min-height: 1.2em; }
    #counter { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <h1>Publica Academy</h1>
  <h2>Course Enrolment</h2>

  <label>Your name:</label>
  <input id="name-input" type="text" placeholder="e.g. Amara Obi">
  <p id="preview">Preview: </p>
  <p id="counter">Characters: 0</p>

  <label>Email:</label>
  <input id="email-input" type="email" placeholder="amara@example.com">

  <br><br>
  <button id="enroll-btn" class="btn btn-primary">Enroll Now</button>
  <p id="status"></p>

  <script src="script.js"></script>
</body>
</html>
