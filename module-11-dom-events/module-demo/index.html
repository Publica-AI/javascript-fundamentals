<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Publica Academy — My Learning Dashboard</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    .hidden { display: none; }
    .alert { background: #fff3cd; color: #856404; padding: 10px 14px; border-radius: 4px; margin: 8px 0; }
    .success { background: #d4edda; color: #155724; padding: 10px 14px; border-radius: 4px; margin: 8px 0; }
    input[type="text"] { width: 62%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .btn { padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 1rem; border: none; }
    .btn-primary { background: navy; color: white; }
    .btn-danger  { background: #dc3545; color: white; }
    .btn-sm      { padding: 4px 10px; font-size: 0.85rem; }
    ul#goal-list { list-style: none; padding: 0; }
    ul#goal-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 4px; margin: 4px 0; }
    .goal-text.done { text-decoration: line-through; color: #888; }
    #search-results { margin-top: 8px; }
    .result-item { padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 4px; margin: 4px 0; cursor: pointer; }
    .result-item:hover { background: #f0f4ff; }
    form#enrol-form { border: 1px solid #dee2e6; padding: 16px; border-radius: 8px; }
    form#enrol-form input { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>My Learning Dashboard</h1>

  <div id="welcome-msg" class="alert hidden"></div>

  <!-- Section 1: Learning Goals -->
  <h2>Learning Goals</h2>
  <input id="goal-input" type="text" placeholder="Add a learning goal...">
  <button id="goal-add-btn" class="btn btn-primary">Add</button>
  <ul id="goal-list"></ul>
  <p id="goal-count">Goals: 0</p>

  <!-- Section 2: Course Search -->
  <h2>Course Search</h2>
  <input id="search-input" type="text" placeholder="Search courses — press Enter or Escape">
  <div id="search-results"></div>

  <!-- Section 3: Enrolment Form -->
  <h2>Enrol in a Course</h2>
  <form id="enrol-form">
    <input id="enrol-name"  type="text"  placeholder="Your full name">
    <input id="enrol-email" type="email" placeholder="Email address">
    <button type="submit" class="btn btn-primary">Confirm Enrolment</button>
  </form>
  <div id="enrol-status" class="hidden"></div>

  <script src="script.js"></script>
</body>
</html>
