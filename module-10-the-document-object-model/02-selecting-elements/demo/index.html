<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Publica Academy — Course Catalogue</title>
</head>
<body>
  <h1 id="page-title" class="main-heading">Publica Academy</h1>
  <p class="tagline">Learn in-demand tech skills</p>

  <div class="course-card">
    <h2 class="card-title">JavaScript Fundamentals</h2>
    <p class="card-price">₦15,000</p>
    <button class="enroll-btn" data-course="js">Enroll</button>
  </div>

  <div class="course-card">
    <h2 class="card-title">HTML & CSS Basics</h2>
    <p class="card-price">₦12,000</p>
    <button class="enroll-btn" data-course="html">Enroll</button>
  </div>

  <div class="course-card">
    <h2 class="card-title">Git & GitHub</h2>
    <p class="card-price">₦10,000</p>
    <button class="enroll-btn" data-course="git">Enroll</button>
  </div>

  <ul id="module-list">
    <li class="module-item">Module 1 — Intro to JavaScript</li>
    <li class="module-item">Module 2 — Variables &amp; Types</li>
    <li class="module-item">Module 3 — Control Flow</li>
  </ul>

  <script src="script.js"></script>
</body>
</html>
